<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;font:400 15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#14171A;background:#fff}
.band{height:64px;background:#0B5563;color:#fff;display:flex;align-items:center;gap:20px;padding:0 24px}
.band b{font-size:20px;letter-spacing:.02em}.band .g{opacity:.85;font-size:14px}.band .sp{flex:1}.band .st{font-size:13px;border:1px solid rgba(255,255,255,.5);padding:4px 10px;border-radius:4px}
.wrap{display:flex;height:836px}
.vid{flex:1;background:#101416;position:relative}
.vid .pt{position:absolute;inset:40px 120px 120px;border-radius:6px;background:#2a3236}
.vid .mid{position:absolute;left:50%;top:40px;bottom:120px;border-left:1px dashed rgba(255,255,255,.35)}
.bar{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:18px}
.cb{width:52px;height:52px;border-radius:50%;background:#2f3a3e}.cb.end{background:#B42318}
.side{width:560px;border-left:1px solid #D5DDE0;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid #D5DDE0}
.tab{padding:10px 12px;font-weight:600;color:#4A565B}.tab.on{color:#0B5563;border-bottom:3px solid #0B5563}
.leaf{background:#EEF2F3;margin:16px;padding:12px 14px;font-size:13px;color:#3B464A}
.m{margin:0 16px 12px;border:1px solid #D5DDE0}
.m h3{margin:0;padding:10px 14px;font-size:15px;border-bottom:1px solid #D5DDE0}
.dose{display:grid;grid-template-columns:1fr 1fr}
.side-l,.side-r{padding:12px 14px;display:flex;align-items:baseline;gap:10px}
.side-l{border-top:6px solid #0B5563}.side-r{border-top:6px solid #B4530A;border-left:1px solid #D5DDE0}
.k{font-weight:700;font-size:14px}.n{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.u{font-size:16px;color:#4A565B}
.void{margin:0 16px;border:2px solid #8B1E1E;color:#8B1E1E;padding:10px 14px;font-weight:700}
.btn{margin:16px;height:52px;background:#0B5563;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:17px}
</style></head><body>
<div class="band"><b>M.A.R.S.</b><span class="g">Пациент №1042 · приём 3 · Лицо</span><span class="sp"></span><span class="st">Связь хорошая</span></div>
<div class="wrap"><div class="vid"><div class="pt"></div><div class="mid"></div><div class="bar"><i class="cb"></i><i class="cb"></i><i class="cb"></i><i class="cb end"></i></div></div>
<div class="side"><div class="tabs"><span class="tab">Карточка</span><span class="tab">Чат</span><span class="tab on">Лицо</span><span class="tab">Заключение</span></div>
<div class="leaf">Числа для документирования, не диагноз. Синтетические данные.</div>
<div class="m"><h3>Подъём брови</h3><div class="dose"><div class="side-l"><span class="k">Л</span><span class="n">4,2</span><span class="u">мм</span></div><div class="side-r"><span class="k">П</span><span class="n">11,8</span><span class="u">мм</span></div></div></div>
<div class="m"><h3>Угол рта при улыбке</h3><div class="dose"><div class="side-l"><span class="k">Л</span><span class="n">2,1</span><span class="u">мм</span></div><div class="side-r"><span class="k">П</span><span class="n">9,4</span><span class="u">мм</span></div></div></div>
<div class="void">Смыкание глаза — недостоверно: поворот головы 14°</div>
<div class="btn">Сделать снимок анфас</div></div></div>
</body></html>
