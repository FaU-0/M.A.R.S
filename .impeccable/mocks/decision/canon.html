<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;font:400 15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#111827;background:#F2F4F7}
.top{height:56px;background:#fff;border-bottom:1px solid #E4E7EC;display:flex;align-items:center;gap:20px;padding:0 24px}.top b{font-size:18px}.top span{color:#475467}
.wrap{display:flex;height:844px;gap:16px;padding:16px}
.vid{flex:1;background:#101828;border-radius:16px;position:relative}.pt{position:absolute;inset:40px 120px 120px;background:#344054;border-radius:12px}
.bar{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:18px}.cb{width:52px;height:52px;border-radius:50%;background:#475467}.cb.end{background:#D92D20}
.side{width:520px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:4px;background:#fff;padding:4px;border-radius:12px}.tabs span{padding:8px 12px;border-radius:8px}.tabs .on{background:#0B5CC4;color:#fff}
.card{background:#fff;border-radius:12px;padding:16px}.v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:#475467}
.btn{height:52px;background:#0B5CC4;color:#fff;border-radius:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="top"><b>M.A.R.S.</b><span>Пациент №1042 · приём 3</span></div>
<div class="wrap"><div class="vid"><div class="pt"></div><div class="bar"><i class="cb"></i><i class="cb"></i><i class="cb"></i><i class="cb end"></i></div></div>

<div class="note">Числа для документирования, не диагноз. Синтетические данные.</div>
<div class="card">Подъём брови<div class="v">Л 4,2 мм · П 11,8 мм</div></div>
<div class="card">Угол рта при улыбке<div class="v">Л 2,1 мм · П 9,4 мм</div></div>
<div class="btn">Сделать снимок анфас</div></div></div>
</body></html>
