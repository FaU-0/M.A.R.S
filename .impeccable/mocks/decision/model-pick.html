<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;font:400 15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#1B1E21;background:#7A7F85}
.top{height:56px;background:#4A4F55;color:#fff;display:flex;align-items:center;gap:20px;padding:0 24px}.top b{font-size:18px}.top span{opacity:.8}
.wrap{display:flex;height:844px}
.vid{flex:1;position:relative;background:#7A7F85}
.frame{position:absolute;inset:48px 140px 130px;background:#5d6268;border:1px solid #c9ccd0}
.ruler{position:absolute;left:140px;right:140px;bottom:104px;height:18px;background:repeating-linear-gradient(90deg,#F4F5F6 0 1px,transparent 1px 10px)}
.ruler2{position:absolute;top:48px;bottom:130px;left:116px;width:18px;background:repeating-linear-gradient(0deg,#F4F5F6 0 1px,transparent 1px 10px)}
.mid{position:absolute;left:50%;top:48px;bottom:130px;border-left:1px solid #F4F5F6}
.bar{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:18px}.cb{width:52px;height:52px;border-radius:50%;background:#3b3f44}.cb.end{background:#B42318}
.side{width:560px;background:#F4F5F6;display:flex;flex-direction:column;gap:12px;padding:16px}
.tabs{display:flex;gap:16px;border-bottom:1px solid #c9ccd0;padding-bottom:8px;font-weight:600;color:#55595e}.tabs .on{color:#1B1E21;border-bottom:2px solid #1B1E21}
.card{background:#fff;padding:14px;border-radius:4px}
.row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.l{color:#1D4E89;font-weight:700}.r{color:#C0632B;font-weight:700}
.big{font-size:30px;font-weight:600}
.chips{display:flex;gap:4px}.chips i{width:28px;height:18px;display:block}
.note{font-size:13px;color:#55595e}
.btn{height:52px;background:#1B1E21;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:4px}
</style></head><body>
<div class="top"><b>M.A.R.S.</b><span>Пациент №1042 · приём 3</span></div>
<div class="wrap"><div class="vid"><div class="frame"></div><div class="mid"></div><div class="ruler"></div><div class="ruler2"></div><div class="bar"><i class="cb"></i><i class="cb"></i><i class="cb"></i><i class="cb end"></i></div></div>
<div class="side"><div class="tabs"><span>Карточка</span><span>Чат</span><span class="on">Лицо</span><span>Заключение</span></div>
<div class="note">Числа для документирования, не диагноз. Синтетические данные.</div>
<div class="card"><div>Подъём брови</div><div class="row big"><span class="l">Л 4,2 мм</span><span class="r">П 11,8 мм</span></div></div>
<div class="card"><div>Угол рта при улыбке</div><div class="row big"><span class="l">Л 2,1 мм</span><span class="r">П 9,4 мм</span></div></div>
<div class="card"><div class="chips"><i style="background:#735244"></i><i style="background:#C29682"></i><i style="background:#627A9D"></i><i style="background:#576C43"></i><i style="background:#8580B1"></i><i style="background:#67BDAA"></i></div><div class="note">Калибровка: 0,21 мм на пиксель · поза в допуске</div></div>
<div class="btn">Сделать снимок анфас</div></div></div>
</body></html>
